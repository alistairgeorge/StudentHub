{% extends "base.html" %}
{% block title %}Sign in | EduTrack{% endblock %}
{% block content %}
    <section class="panel auth-panel">
        <p class="eyebrow">ADMIN ACCESS</p>
        <h1>Sign in</h1>
        <p class="muted">Sign in to manage student and teacher records and view reports.</p>
        <form class="record-form" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>Username
                <input name="username" required autocomplete="username" autofocus>
            </label>
            <label for="login-password">Password</label>
            <div class="password-control">
                <input id="login-password" type="password" name="password" required autocomplete="current-password">
                <button class="password-toggle" type="button" aria-controls="login-password" aria-pressed="false">Show</button>
            </div>
            <button class="button" type="submit">Sign in</button>
        </form>
    </section>
{% endblock %}
